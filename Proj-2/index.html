<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Proj-2</title>

    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="main">
      <nav>
        <img src="./assets/logo.png" alt="" />

        <div class="nav-links">
          <a href="#">About</a>
          <a href="#" class="active">Watch now</a>
          <a href="#">Actors</a>
          <a href="#">Contact</a>
        </div>

        <i class="ri-menu-3-line"></i>
      </nav>

      <div class="hero">
        <!-- left -->

        <div class="left">
          <img src="./assets/title.png" alt="" class="title-img" />

          <p>
            Action / Thriller / Drama Series directed by Dong-hyuk Hwang
            <br />
            Season 1: 9 Episodes
          </p>

          <div class="buttons">
            <button class="play-btn">
              <i class="ri-play-circle-fill"></i>

              Play Now
            </button>

            <button class="trailer-btn">
              <i class="ri-play-mini-line"></i>

              Watch Trailer
            </button>
          </div>
        </div>

        <div class="center-text">
          <span>SCROLL</span>

          <div class="line"></div>
        </div>

        <div class="right">
          <img src="./assets/guard.png" alt="" />
        </div>
      </div>

      <div class="socials">
        <i class="ri-twitter-line"></i>
        <i class="ri-instagram-line"></i>
        <i class="ri-facebook-line"></i>
      </div>

      <div class="bottom-cards">
        <div class="bottom-card">
          <img src="./assets/card1.webp" alt="" />

          <div class="play-icon">
            <i class="ri-play-fill"></i>
          </div>
        </div>

        <div class="bottom-card">
          <img src="./assets/card2.jfif" alt="" />

          <div class="play-icon">
            <i class="ri-play-fill"></i>
          </div>
        </div>

        <div class="bottom-card">
          <img src="./assets/card3.jfif" alt="" />

          <div class="play-icon">
            <i class="ri-play-fill"></i>
          </div>
        </div>
      </div>

     <h1 class="bg-text">GAME</h1>

      <h1 class="side-text">SQUID</h1>
    </div>
  </body>
</html>
